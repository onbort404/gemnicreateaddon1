name: Budowanie Moda (.jar)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod projektu
        uses: actions/checkout@v4

      - name: Zainstaluj Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Zbuduj plik .jar moda
        run: gradle build --no-daemon

      - name: Udostepnij gotowy plik .jar do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: create_andesite_mechanica-jar
          path: build/libs/*.jar
